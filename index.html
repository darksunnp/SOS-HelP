<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morse Signal Flasher</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>

  <h1>MORSE Code - Made Easy </h1>
  <p id="warning">This page flashes the screen and may affect people with epilepsy.</p>
  <p id="warning">This page saves a cached copy to work offline.</p>
  <label for="speed">Speed: <span id="speedValue">8</span> WPM</label>
  <input id="speed" type="range" min="5" max="15" value="8">
  <label for="message">Message</label>
  <input id="message" type="text" value="SOS">
  <button id="start">START</button>
  <button id="stop">STOP</button>

  <div id="flash">

  </div>

  <script src="morse.js"></script>
  <script src="app.js"></script>
</body>
</html>
